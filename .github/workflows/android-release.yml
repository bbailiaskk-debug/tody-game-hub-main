name: Android (TWA) build

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'

permissions:
  contents: read

jobs:
  build:
    name: Build TWA APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Configure Bubblewrap (avoid interactive prompts)
        shell: bash
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF
          echo "Bubblewrap config: $(cat "$HOME/.bubblewrap/config.json")"

      - name: Restore signing keystore
        shell: bash
        run: |
          set -e
          if [ -z "${{ secrets.TWA_KEYSTORE_BASE64 }}" ]; then
            echo "::error::TWA_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "${{ secrets.TWA_KEYSTORE_BASE64 }}" | base64 -d > android/android.keystore
          ls -la android/android.keystore

      - name: Generate Android project from twa-manifest.json
        working-directory: android
        run: npx --yes @bubblewrap/cli@1.25.0 update --skipVersionUpgrade

      - name: Build and sign APK + AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: npx --yes @bubblewrap/cli@1.25.0 build

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app-release-bundle.aab

      - name: Upload APK (sideload / testing)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app-release-signed.apk