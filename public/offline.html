<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#ffffff" />
<title>Няма интернет — Todor Khristov Gaming</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #ffffff;
    color: #202124;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  #reload {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #5f6368;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .2s;
  }
  #reload:hover { background: rgba(0,0,0,.05); }
  #reload svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #page {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 48px 28px 72px;
  }
  .dino-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  canvas#dino { width: 152px; height: 84px; image-rendering: pixelated; }
  .hint { color: #5f6368; font-size: 16px; line-height: 1.5; }
  h1 { font-size: 30px; font-weight: 500; color: #202124; }
  .sub { margin-top: 12px; color: #5f6368; font-size: 17px; line-height: 1.6; }
  .sec { margin-top: 34px; }
  .sec h2 { font-size: 16px; font-weight: 500; color: #3c4043; margin-bottom: 10px; }
  .sec ul { list-style: none; padding: 0; margin: 0; }
  .sec li { margin-top: 10px; color: #5f6368; font-size: 16px; line-height: 1.6; }
  .sec li::before { content: "\2014\00a0"; color: #5f6368; }
  .code {
    margin-top: 34px;
    display: inline-block;
    font-family: "Roboto Mono", ui-monospace, "SF Mono", Consolas, Menlo, monospace;
    font-size: 15px;
    color: #202124;
    background: #f1f3f4;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .2s, border-color .2s;
  }
  .code:hover { background: #e8eaed; border-color: rgba(0,0,0,.08); }

  #game { margin-top: 56px; }
  #game .g-card {
    background: #fafafa;
    border: 1px solid #e8eaed;
    border-radius: 16px;
    padding: 20px 20px 26px;
  }
  #game .g-head {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 26px;
    font-family: "Roboto Mono", ui-monospace, "SF Mono", Consolas, Menlo, monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .05em;
    color: #5f6368;
    margin-bottom: 12px;
  }
  #game .g-head .g-score { color: #202124; }
  #gwrap { position: relative; width: 100%; max-width: 760px; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #gwrap:focus { outline: none; }
  #gwrap:focus-visible::after {
    content: "";
    position: absolute;
    inset: 3px;
    border: 2px solid rgba(26,115,232,.35);
    border-radius: 12px;
    pointer-events: none;
  }
  canvas#c { display: block; width: 100%; height: auto; image-rendering: pixelated; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    background: rgba(255,255,255,.78);
  }
  .overlay[hidden] { display: none; }
  .overlay .ov-title { font-size: 30px; font-weight: 500; color: #202124; }
  .overlay .ov-sub { font-family: "Roboto Mono", ui-monospace, "SF Mono", Consolas, Menlo, monospace; font-size: 15px; color: #5f6368; }
  .overlay .ov-keys { font-size: 15px; color: #5f6368; }
  .overlay button {
    font: inherit;
    font-size: 15px;
    color: #1a73e8;
    background: transparent;
    border: 1px solid #dadce0;
    border-radius: 9999px;
    padding: 10px 22px;
    cursor: pointer;
    transition: background .2s, box-shadow .2s;
  }
  .overlay button:hover { background: rgba(26,115,232,.06); box-shadow: 0 1px 2px rgba(60,64,67,.3); }
  .overlay .ov-row { display: flex; gap: 10px; }

  @media (max-width: 520px) {
    #page { padding: 32px 20px 56px; }
    h1 { font-size: 26px; }
    .sub { font-size: 16px; }
    canvas#dino { width: 130px; height: 72px; }
    #game .g-card { padding: 14px 12px 18px; }
  }
</style>
</head>
<body>
  <button id="reload" type="button" aria-label="Презареждане">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>

  <div id="page">
    <div id="error">
      <div class="dino-row" id="dinorow">
        <canvas id="dino" width="208" height="114"></canvas>
        <p class="hint" id="hint"></p>
      </div>

      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>

      <div class="sec">
        <h2 id="tryTitle"></h2>
        <ul id="tryList"></ul>
      </div>

      <div class="sec">
        <h2 id="probeTitle"></h2>
        <ul id="probeList"></ul>
      </div>

      <span class="code" id="code" role="button" tabindex="0"></span>
    </div>

    <div id="game">
      <div class="g-card">
        <div class="g-head">
          <span id="g-high"></span>
          <span class="g-score" id="g-score"></span>
        </div>
        <div id="gwrap" tabindex="0" role="application" aria-label="Dino game — натиснете интервал или стрелка нагоре, за да скачате">
          <canvas id="c" width="900" height="300"></canvas>
          <div class="overlay" id="o-start" hidden>
            <span class="ov-sub" id="o-start-hint"></span>
            <span class="ov-keys" id="o-start-keys"></span>
            <button type="button" id="btn-start"></button>
          </div>
          <div class="overlay" id="o-over" hidden>
            <span class="ov-title" id="o-over-title"></span>
            <span class="ov-sub" id="o-over-score"></span>
            <div class="ov-row">
              <button type="button" id="btn-again"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ============================================================
   Offline page — Chrome-style, self-contained Chrome Dino game.
   ============================================================ */
(function () {
  var LANGS = {
    bg: {
      hint: "Натиснете интервал, за да играете",
      title: "Няма интернет",
      sub: "Няма достъп до интернет за тази страница.",
      tryTitle: "Опитайте да я презаредите:",
      tryList: [
        "Проверете мрежовите кабели, модема или рутера.",
        "Свържете се отново с Wi-Fi.",
        "Пуснете отново или включете рутера и модема си.",
      ],
      probeTitle: "Проучваме проблема:",
      probeList: ["Проверете DNS настройките си."],
      code: "DNS_PROBE_FINISHED_NO_INTERNET",
      retry: "Презареждане на страницата…",
      high: "НАЙ-ДОБЪР",
      score: "РЕЗУЛТАТ",
      startHint: "Натиснете интервал, за да играете",
      startKeys: "Интервал",
      startBtn: "СТАРТ",
      overTitle: "Играта свърши",
      yourScore: "Твой резултат",
      again: "Още веднъж",
      back: "Към грешката",
    },
    en: {
      hint: "Press space to play",
      title: "No internet",
      sub: "There is no internet connection for this page.",
      tryTitle: "Try reloading:",
      tryList: [
        "Check network cables, modem, and router.",
        "Reconnect to Wi-Fi.",
        "Turn router or modem back on.",
      ],
      probeTitle: "Still not connected? Let's take a closer look:",
      probeList: ["Check your DNS settings."],
      code: "DNS_PROBE_FINISHED_NO_INTERNET",
      retry: "Reloading the page…",
      high: "HIGH SCORE",
      score: "SCORE",
      startHint: "Press space to play",
      startKeys: "Space",
      startBtn: "START",
      overTitle: "Game over",
      yourScore: "Your score",
      again: "Play again",
      back: "Back",
    },
    zh: {
      hint: "按空格键开始游戏",
      title: "无法访问互联网",
      sub: "此页面无法访问互联网。",
      tryTitle: "尝试重新加载：",
      tryList: [
        "检查网络电缆、调制解调器和路由器。",
        "重新连接到 Wi-Fi。",
        "重新打开或开启路由器和调制解调器。",
      ],
      probeTitle: "进一步排查问题：",
      probeList: ["检查 DNS 设置。"],
      code: "DNS_PROBE_FINISHED_NO_INTERNET",
      retry: "正在重新加载页面…",
      high: "最高分",
      score: "分数",
      startHint: "按空格键开始游戏",
      startKeys: "空格",
      startBtn: "开始",
      overTitle: "游戏结束",
      yourScore: "你的分数",
      again: "再玩一次",
      back: "返回",
    },
  };

  function getLang() {
    try {
      var raw = localStorage.getItem("tody_settings");
      if (raw) {
        var s = JSON.parse(raw);
        if (s && (s.lang === "bg" || s.lang === "en" || s.lang === "zh")) return s.lang;
      }
    } catch (e) {}
    var nav = (navigator.language || "bg").toLowerCase();
    if (nav.indexOf("zh") === 0) return "zh";
    if (nav.indexOf("en") === 0) return "en";
    return "bg";
  }

  var L = LANGS[getLang()] || LANGS.bg;

  /* ---------------- Chrome-style static dino ---------------- */
  var dinoCanvas = document.getElementById("dino");
  var dctx = dinoCanvas.getContext("2d");
  function drawStaticDino() {
    dctx.clearRect(0, 0, 208, 114);
    dctx.setTransform(2, 0, 0, 2, 0, 0);
    // view box ~ 104 x 57, ground at y = 46
    var GY = 46;
    var x = 6;
    var bodyY = GY - 22;
    dctx.fillStyle = "#5f6368";
    dctx.fillRect(x, bodyY, 26, 22);           // body
    dctx.fillRect(x + 16, bodyY - 20, 24, 24); // head
    dctx.fillRect(x - 6, bodyY + 12, 12, 14);  // tail
    dctx.fillStyle = "#ffffff";
    dctx.fillRect(x + 30, bodyY - 14, 8, 8);   // eye white
    dctx.fillStyle = "#202124";
    dctx.fillRect(x + 34, bodyY - 12, 4, 4);   // pupil
    dctx.fillStyle = "#5f6368";
    dctx.fillRect(x + 4, GY - 6, 6, 16);       // leg 1
    dctx.fillRect(x + 14, GY, 6, 18);          // leg 2
    dctx.strokeStyle = "#c6c6c6";
    dctx.lineWidth = 2;
    dctx.beginPath();
    dctx.moveTo(0, GY + 2);
    dctx.lineTo(104, GY + 2);
    dctx.stroke();
  }
  drawStaticDino();

  /* ---------------- Game ---------------- */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var GAME_W = 900;
  var GAME_H = 300;
  var GROUND_Y = 258;
  var COL = {
    bg: "#ffffff",
    ground: "#c6c6c6",
    dino: "#535353",
    dark: "#262626",
    cactus: "#535353",
  };

  var keys = {};
  var dinoY = GROUND_Y;
  var vy = 0;
  var ducking = false;
  var obstacles = [];
  var spawnTimer = 0;
  var speed = 320;
  var frames = 0;
  var score = 0;
  var running = false;
  var over = false;
  var best = 0;
  var disp = 0;
  var last = null;
  var raf = null;

  var highEl = document.getElementById("g-high");
  var scoreEl = document.getElementById("g-score");
  var startOverlay = document.getElementById("o-start");
  var overOverlay = document.getElementById("o-over");
  var startHintEl = document.getElementById("o-start-hint");
  var startKeysEl = document.getElementById("o-start-keys");
  var btnStart = document.getElementById("btn-start");
  var btnAgain = document.getElementById("btn-again");
  var overScoreEl = document.getElementById("o-over-score");

  /* fill Chrome-style text */
  document.getElementById("hint").textContent = L.hint;
  document.getElementById("title").textContent = L.title;
  document.getElementById("sub").textContent = L.sub;
  document.getElementById("tryTitle").textContent = L.tryTitle;
  document.getElementById("tryList").innerHTML = L.tryList
    .map(function (t) { return "<li>" + t + "</li>"; })
    .join("");
  document.getElementById("probeTitle").textContent = L.probeTitle;
  document.getElementById("probeList").innerHTML = L.probeList
    .map(function (t) { return "<li>" + t + "</li>"; })
    .join("");
  document.getElementById("code").textContent = L.code;

  startHintEl.textContent = L.startHint;
  startKeysEl.textContent = L.startKeys;
  btnStart.textContent = L.startBtn;
  btnAgain.textContent = L.again;

  try { best = parseInt(localStorage.getItem("dino-high-score") || "0", 10) || 0; } catch (e) {}
  highEl.textContent = L.high + "  " + best;
  scoreEl.textContent = L.score + "  0";

  function drawDino(game) {
    var x = 60;
    var y = dinoY;
    ctx.fillStyle = COL.dino;
    if (game) {
      if (ducking) {
        ctx.fillRect(x, y + 8, 48, 18);
        ctx.fillRect(x + 34, y + 2, 24, 18);
        ctx.fillRect(x + 50, y + 14, 14, 12);
        ctx.fillStyle = COL.dark;
        ctx.fillRect(x + 42, y + 8, 5, 8);
      } else {
        ctx.fillRect(x, y, 26, 22);
        ctx.fillRect(x + 16, y - 20, 24, 24);
        ctx.fillRect(x - 6, y + 12, 12, 14);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 30, y - 14, 8, 8);
        ctx.fillStyle = COL.dark;
        ctx.fillRect(x + 34, y - 12, 4, 4);
        ctx.fillStyle = COL.dino;
        var legY = frames % 10 < 5 ? y + 22 : y + 18;
        ctx.fillRect(x + 4, legY, 6, 16);
        ctx.fillRect(x + 14, y + 20, 6, 18);
      }
    } else {
      var GY = GROUND_Y;
      ctx.fillRect(x, y, 26, 22);
      ctx.fillRect(x + 16, y - 20, 24, 24);
      ctx.fillRect(x - 6, y + 12, 12, 14);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x + 30, y - 14, 8, 8);
      ctx.fillStyle = COL.dark;
      ctx.fillRect(x + 34, y - 12, 4, 4);
      ctx.fillStyle = COL.dino;
      ctx.fillRect(x + 4, GY + 8, 6, 16);
      ctx.fillRect(x + 14, GY + 12, 6, 18);
    }
  }

  function drawObstacle(o) {
    ctx.fillStyle = COL.cactus;
    var trunk = o.height;
    var r = Math.min(10, o.width);
    // trunk with rounded top
    ctx.beginPath();
    ctx.roundRect(o.x, GROUND_Y - trunk, o.width, trunk, r);
    ctx.fill();
    // arms
    ctx.fillRect(o.x - 7, GROUND_Y - trunk + 10, 7, 7);
    ctx.fillRect(o.x + o.width, GROUND_Y - trunk + 20, 7, 7);
  }

  function drawFrame() {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    ctx.strokeStyle = COL.ground;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(GAME_W, GROUND_Y);
    ctx.stroke();
    ctx.fillStyle = COL.ground;
    for (var i = 0; i < 9; i++) {
      var gx = (((i * 100 - score * 2) % (GAME_W + 100)) + GAME_W) % (GAME_W + 100);
      ctx.fillRect(gx, GROUND_Y + 8, 26, 3);
    }
    obstacles.forEach(drawObstacle);
    drawDino(true);
  }

  function reset() {
    dinoY = GROUND_Y;
    vy = 0;
    ducking = false;
    obstacles = [];
    spawnTimer = 0;
    speed = 320;
    frames = 0;
    score = 0;
    disp = 0;
    last = null;
  }

  function step(now) {
    raf = requestAnimationFrame(step);
    if (last === null) { last = now; return; }
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    var space = keys[" "] || keys["ArrowUp"];
    var down = keys["ArrowDown"];
    var onGround = dinoY >= GROUND_Y;

    if (space && onGround) { vy = -760; dinoY = GROUND_Y - 2; }
    if (dinoY < GROUND_Y) {
      vy += 2200 * dt;
      dinoY += vy * dt;
      if (dinoY > GROUND_Y) { dinoY = GROUND_Y; vy = 0; }
    }
    ducking = onGround && down;

    speed = Math.min(320 + score * 0.6, 720);
    frames += 1;
    score += dt * speed * 0.02;
    var ns = Math.floor(score);
    if (ns !== disp) {
      disp = ns;
      scoreEl.textContent = L.score + "  " + ns;
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      obstacles.push({ x: GAME_W + 20, width: 22, height: Math.random() < 0.5 ? 36 : 54 });
      spawnTimer = 0.9 + Math.random() * 1.4;
    }
    obstacles = obstacles.filter(function (o) { return o.x + o.width > -20; });
    for (var i = 0; i < obstacles.length; i++) obstacles[i].x -= speed * dt;

    var w = ducking ? 58 : 40;
    var h = ducking ? 26 : 42;
    var dh = { x: 60, y: ducking ? dinoY + 8 : dinoY - 20, width: w, height: h };
    for (var j = 0; j < obstacles.length; j++) {
      var o = obstacles[j];
      var oh = { x: o.x + 2, y: GROUND_Y - o.height, width: o.width - 4, height: o.height };
      if (dh.x < oh.x + oh.width && dh.x + dh.width > oh.x && dh.y < oh.y + oh.height && dh.y + dh.height > oh.y) {
        gameOver();
        return;
      }
    }

    drawFrame();
  }

  function start() {
    if (over) reset();
    running = true;
    over = false;
    last = null;
    disp = 0;
    scoreEl.textContent = L.score + "  0";
    startOverlay.hidden = true;
    overOverlay.hidden = true;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(step);
  }

  function gameOver() {
    running = false;
    over = true;
    if (raf) cancelAnimationFrame(raf);
    var newBest = Math.max(best, Math.floor(score));
    if (newBest !== best) {
      best = newBest;
      try { localStorage.setItem("dino-high-score", String(newBest)); } catch (e) {}
      highEl.textContent = L.high + "  " + newBest;
    }
    overScoreEl.textContent = L.yourScore + ": " + Math.floor(score);
    startOverlay.hidden = true;
    overOverlay.hidden = false;
  }

  window.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") e.preventDefault();
    keys[e.key] = true;
    if (e.key === " " || e.key === "ArrowUp") start();
  });
  window.addEventListener("keyup", function (e) { keys[e.key] = false; });

  document.getElementById("dinorow").addEventListener("pointerdown", start);

  var gwrap = document.getElementById("gwrap");
  gwrap.addEventListener("pointerdown", function () {
    if (over || !running) { start(); return; }
    keys[" "] = true;
    window.setTimeout(function () { keys[" "] = false; }, 120);
  });

  /* Focus & keyboard hardening -----------------------------------
     Автоматично фокусираме играта при зареждане (и при връщане в
     раздела), така че Space / стрелките да постъпват веднага в
     играта, без да е нужно първо мър-кликване на страницата.      */
  function focusGame() {
    try {
      var f = document.activeElement;
      if (f && (f.tagName === "BUTTON" || f.tagName === "A" || f.tagName === "INPUT")) return;
      gwrap.focus({ preventScroll: true });
    } catch (e) {
      try { gwrap.focus(); } catch (e2) {}
    }
  }
  function onVisible() {
    if (!document.hidden) focusGame();
  }
  document.addEventListener("visibilitychange", onVisible);
  window.addEventListener("focus", onVisible);
  gwrap.addEventListener("pointerdown", function () {
    try { gwrap.focus({ preventScroll: true }); } catch (e) {}
  });
  startOverlay.addEventListener("click", start);
  overOverlay.addEventListener("click", start);
  /* зареждаме веднага (страницата вече се показва през SW, без
     чакане за допълнителни ресурси) */
  focusGame();

  btnStart.addEventListener("click", start);
  btnAgain.addEventListener("click", start);

  document.getElementById("code").addEventListener("click", tryReload);
  document.getElementById("code").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tryReload(); }
  });

  function tryReload() {
    if (navigator.onLine) {
      window.location.href = "/";
    } else {
      window.location.reload();
    }
  }

  document.getElementById("reload").addEventListener("click", tryReload);

  window.addEventListener("online", function () {
    if (navigator.onLine) window.location.replace("/");
  });

  setInterval(function () {
    if (!navigator.onLine) return;
    fetch("favicon.ico", { method: "HEAD", cache: "no-store" })
      .then(function (res) {
        if (res.ok) window.location.replace("/");
      })
      .catch(function () {});
  }, 8000);

  /* initial state: error view + hidden start overlay on game area */
  reset();
  startOverlay.hidden = false;
})();
</script>
</body>
</html>
