<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1a17" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Офлайн страница на Todor Khristov Gaming — възстанови връзката и продължи играта."
    />
    <title>Offline — Todor Khristov Gaming</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1a17;
        color: #e7f5ef;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 40px 32px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        background: #161b16;
        box-shadow: 0 0 40px rgba(29, 185, 84, 0.12);
      }
      .puck {
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffffff, #c8d6cf 55%, #6b7b72);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 6px rgba(29, 185, 84, 0.25);
      }
      h1 {
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #9db8a9;
        margin-bottom: 28px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid rgba(29, 185, 84, 0.5);
        background: #161b16;
        color: #1db954;
        padding: 12px 28px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        transition: background 0.2s, box-shadow 0.2s;
      }
      button:hover {
        background: rgba(29, 185, 84, 0.12);
        box-shadow: 0 0 18px rgba(29, 185, 84, 0.25);
      }
      .hint {
        margin-top: 22px;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #5f7267;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="puck" aria-hidden="true"></div>
      <h1>Няма връзка</h1>
      <p>
        Изглежда интернет връзката е спряна. Свържи се отново и опитай — играта чака.
      </p>
      <button type="button" id="retry">Опитай отново</button>
      <div class="hint">Todor Khristov Gaming</div>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
    </script>
  </body>
</html>
