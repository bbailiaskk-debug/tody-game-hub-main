# Nginx Proxy Manager — Proxy Host "Advanced" config
# Paste this block into the Proxy Host -> Advanced field.
#
# Origin is a Cloudflare Worker. The Worker already sends the correct
# Cache-Control headers (immutable, 30 days for hashed /assets/* via _headers;
# no-cache for HTML), so this proxy must NOT layer its own caching on top —
# just proxy cleanly and forward the client details the app needs.
#
# IMPORTANT: The site uses WebSockets for the realtime games
# (/api/ws/chess/*, /api/ws/ttt/*, /api/ws/airhockey/*), so ALSO enable the
# "Websockets Support" toggle on the Proxy Host. Nginx Proxy Manager defines
# the $connection_upgrade map globally — keep the Upgrade/Connection lines
# below; do NOT remove them (they are only invalid outside NPM).

# ---- TLS to the Worker origin (SNI + Host must match the Worker) ----
proxy_ssl_server_name on;
proxy_ssl_name tody-game-hub.bbailiaskk.workers.dev;
proxy_set_header Host tody-game-hub.bbailiaskk.workers.dev;

# ---- HTTP/1.1 + WebSocket upgrade support ----
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# ---- Forward the real client details (required by the app: it uses
#      x-forwarded-proto to detect https and avoid redirect loops) ----
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# ---- Timeouts tuned for realtime WebSockets (clients ping every 15s) ----
proxy_connect_timeout 10s;
proxy_send_timeout 75s;
proxy_read_timeout 75s;
proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 16k;

# ---- Request size guard for server-function payloads ----
client_max_body_size 256k;

# ---- Security headers on responses ----
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;