<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <!--
      The picker's own styles, kept here rather than pulled from the site.

      It is a local file opened by the shell: it has no access to the app's
      stylesheets, and it must not reach for the network to get them either,
      because a window that cannot paint is a window that cannot answer.
    -->
    <title>Споделяне на екран</title>
    <style>
      :root {
        --bg: #0b0d12;
        --card: #151922;
        --line: #262c3a;
        --text: #e8ebf2;
        --muted: #939cb1;
        --accent: #5865f2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }

      header {
        padding: 18px 20px 12px;
        flex: none;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 3px;
      }

      p {
        color: var(--muted);
        margin: 0;
        font-size: 12.5px;
      }

      /* The grid scrolls on its own so the buttons underneath stay reachable on a
         short window rather than being pushed off the bottom of it. */
      main {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 20px 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px;
      }

      .card {
        display: block;
        width: 100%;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        overflow: hidden;
        transition:
          border-color 0.12s ease,
          transform 0.12s ease;
      }

      .card:hover,
      .card:focus-visible {
        border-color: var(--accent);
        outline: none;
        transform: translateY(-1px);
      }

      .shot {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0e1118;
        object-fit: contain;
      }

      /* A thumbnail Electron could not produce — a protected window, mostly —
         leaves a hole rather than a broken image icon. */
      .shot--missing {
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .label {
        display: block;
        padding: 8px 10px 10px;
        font-size: 12.5px;
        line-height: 1.35;
        word-break: break-word;
      }

      .kind {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }

      footer {
        flex: none;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--line);
      }

      button.ghost {
        padding: 7px 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button.ghost:hover {
        border-color: var(--muted);
      }

      .empty {
        color: var(--muted);
        padding: 28px 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Какво да споделите?</h1>
      <p>
        Целият екран или само едно прозорец. Програмата споделя картината без звук от компютъра —
        микрофонът остава отделен и работи през целия разговор. Ако споделянето на прозорец не
        започне, Windows не позволява да се заснеме — изберете екран.
      </p>
    </header>

    <main>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>Няма какво да се предложи.</p>
    </main>

    <footer>
      <button class="ghost" id="cancel" type="button">Отказ</button>
    </footer>

    <script>
      "use strict";

      /**
       * Only ever one answer.
       *
       * A double click on a card, or Escape arriving in the same tick as the
       * click, would otherwise send two answers to one question, and the second
       * one throws inside Electron after the share is already running.
       */
      let answered = false;
      const answer = (run) => {
        if (answered) return;
        answered = true;
        void run();
      };

      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");

      const card = (item) => {
        const button = document.createElement("button");
        button.className = "card";
        button.type = "button";
        button.title = item.name;

        if (item.thumbnail) {
          const shot = document.createElement("img");
          shot.className = "shot";
          shot.src = item.thumbnail;
          // A data URL that failed to decode is this window's problem to survive,
          // not a reason to leave a broken image on the screen.
          shot.addEventListener("error", () => shot.replaceWith(missing(item.kind)));
          button.append(shot);
        } else {
          button.append(missing(item.kind));
        }

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item.name;
        const kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = item.kind === "screen" ? "Екран" : "Прозорец";
        label.append(kind);
        button.append(label);

        button.addEventListener("click", () => answer(() => window.picker.pick(item.id)));
        return button;
      };

      const missing = (kind) => {
        const box = document.createElement("span");
        box.className = "shot shot--missing";
        box.textContent = kind === "screen" ? "Екран" : "Прозорец";
        return box;
      };

      const render = (items) => {
        grid.replaceChildren(...items.map(card));
        empty.hidden = items.length > 0;
        // The first card takes focus so Enter shares without a click, which is
        // what somebody who has already decided expects to happen.
        grid.querySelector(".card")?.focus();
      };

      window.picker.sources().then(render);
      document
        .getElementById("cancel")
        .addEventListener("click", () => answer(() => window.picker.cancel()));

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          answer(() => window.picker.cancel());
        }
      });
    </script>
  </body>
</html>
